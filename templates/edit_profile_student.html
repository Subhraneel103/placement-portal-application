{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Edit Student Profile</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('edit_profile') }}" method="POST" enctype="multipart/form-data">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="fullname" class="form-control" value="{{ student.name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">College</label>
                                <input type="text" name="college" class="form-control" value="{{ student.college }}" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Branch</label>
                                <input type="text" name="branch" class="form-control" value="{{ student.branch }}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Semester</label>
                                <input type="number" name="semester" class="form-control" value="{{ student.semester }}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">CGPA</label>
                                <input type="number" step="0.01" name="cgpa" class="form-control" value="{{ student.cgpa }}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Update Resume (Current: {{ student.resume_path.split('/')[-1].split('\\')[-1] }})</label>
                            <input type="file" name="resume" class="form-control">
                            <small class="text-muted">Leave blank to keep your current resume.</small>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
