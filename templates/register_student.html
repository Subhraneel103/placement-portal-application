{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="card shadow-sm border-0 mt-3">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h3 class="mb-0">Student Registration</h3>
                </div>
                
                <div class="card-body p-4">
                    <form action="{{ url_for('register_student') }}" method="POST" enctype="multipart/form-data">
                        
                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="fullname" name="fullname" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label fw-bold">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label fw-bold">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="college" class="form-label fw-bold">College</label>
                                <input type="text" class="form-control" id="college" name="college" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="branch" class="form-label fw-bold">Branch</label>
                                <input type="text" class="form-control" id="branch" name="branch" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="semester" class="form-label fw-bold">Semester</label>
                                <input type="text" class="form-control" id="semester" name="semester" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cgpa" class="form-label fw-bold">Current CGPA</label>
                                <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="resume" class="form-label fw-bold">Upload Resume (PDF only)</label>
                            <input type="file" class="form-control" id="resume" name="resume" accept=".pdf" required>
                        </div>

                        <hr class="my-4">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirm_password" class="form-label fw-bold">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
                            <p class="text-center mt-2">
                                Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none">Login here</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
