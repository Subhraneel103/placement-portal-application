{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Edit Company Profile</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('edit_company_profile') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text" name="company_name" class="form-control" value="{{ company.company_name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Website URL</label>
                            <input type="url" name="website" class="form-control" value="{{ company.website }}" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">HR Name</label>
                                <input type="text" name="hr_name" class="form-control" value="{{ company.hr_name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">HR Contact Email/Phone</label>
                                <input type="text" name="hr_contact" class="form-control" value="{{ company.hr_contact }}" required>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Update Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
