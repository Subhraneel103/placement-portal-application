<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration</title>
    
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #form-body{
            width:400px;
            height:775px;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h3 class="text-center">Company Registration</h1>
                
                <form action="/register/company" method="post">
                    <div class="mb-3">
                        <label for="company_name" class="form-label">Company Name</label>
                        <input type="text" class="form-control" id="company_name" name="company_name" required>
                    </div>

                    <div class="mb-3">
                        <label for="website" class="form-label">Company Website (URL)</label>
                        <input type="url" class="form-control" id="website" name="website" placeholder="https://example.com" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="hr_name" class="form-label">HR Contact Name</label>
                            <input type="text" class="form-control" id="hr_name" name="hr_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="hr_contact" class="form-label">HR Phone/Mobile</label>
                            <input type="text" class="form-control" id="hr_contact" name="hr_contact" required>
                        </div>
                    </div>

                    <hr> <div class="mb-3">
                        <label for="email" class="form-label">Official Work Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary w-100">Submit for Approval</button>
                        <p class="mt-3">Back to <a href="/login">Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
