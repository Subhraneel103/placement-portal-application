{% extends 'base.html' %}

{% block title %}Company Registration | Placement Portal{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h3 class="mb-0 fw-bold">Company Registration</h3>
                </div>
                
                <div class="card-body p-4">
                    <form action="{{ url_for('register_company') }}" method="POST">
                        
                        <div class="mb-3">
                            <label for="company_name" class="form-label fw-bold">Company Name</label>
                            <input type="text" class="form-control" id="company_name" name="company_name" required>
                        </div>

                        <div class="mb-3">
                            <label for="website" class="form-label fw-bold">Company Website (URL)</label>
                            <input type="url" class="form-control" id="website" name="website" placeholder="https://example.com" required>
                        </div>

                        <hr class="my-4 text-muted">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="hr_name" class="form-label fw-bold">HR Name</label>
                                <input type="text" class="form-control" id="hr_name" name="hr_name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="hr_contact" class="form-label fw-bold">HR Phone/Mobile</label>
                                <input type="tel" class="form-control" id="hr_contact" name="hr_contact" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Official Work Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="hr@company.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirm_password" class="form-label fw-bold">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">Submit for Approval</button>
                        </div>

                        <div class="text-center mt-3">
                            <p class="small text-muted">Back to <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">Login</a></p>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
