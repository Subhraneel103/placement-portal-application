{% extends 'base.html' %}

{% block title %}Edit Drive: {{ drive.job_title }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h4 class="mb-0 fw-bold">Update Placement Drive Details</h4>
                </div>
                
                <div class="card-body p-4">
                    <form action="{{ url_for('edit_drive', drive_id=drive.id) }}" method="POST">
                        
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="job_title" class="form-label fw-bold">Job Title</label>
                                <input type="text" class="form-control" id="job_title" name="job_title" 
                                       value="{{ drive.job_title }}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="deadline" class="form-label fw-bold">Application Deadline</label>
                                <input type="date" class="form-control" id="deadline" name="deadline" 
                                       value="{{ drive.deadline.strftime('%Y-%m-%d') if drive.deadline else '' }}" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="job_location" class="form-label fw-bold">Job Location</label>
                                <input type="text" class="form-control" id="job_location" name="job_location" 
                                       value="{{ drive.job_location }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="eligibility_CGPA" class="form-label fw-bold">Minimum CGPA</label>
                                <input type="number" step="0.01" class="form-control" id="eligibility_CGPA" name="eligibility_CGPA" 
                                       value="{{ drive.eligibility_CGPA }}" required>
                            </div>
                        </div>

                        <hr class="my-4 text-muted">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="allowed_branches" class="form-label fw-bold">Allowed Branches</label>
                                <input type="text" class="form-control" id="allowed_branches" name="allowed_branches" 
                                       value="{{ drive.allowed_branches }}" placeholder="e.g. CS, IT, ECE">
                            </div>
                            <div class="col-md-6">
                                <label for="allowed_years" class="form-label fw-bold">Allowed Passout Years</label>
                                <input type="text" class="form-control" id="allowed_years" name="allowed_years" 
                                       value="{{ drive.allowed_years }}" placeholder="e.g. 2026, 2027">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="eligibility_others" class="form-label fw-bold">Other Eligibility Criteria</label>
                            <textarea class="form-control" id="eligibility_others" name="eligibility_others" 
                                      rows="2">{{ drive.eligibility_criteria_others }}</textarea>
                        </div>

                        <div class="mb-4">
                            <label for="job_description" class="form-label fw-bold">Full Job Description</label>
                            <textarea class="form-control" id="job_description" name="job_description" 
                                      rows="6" required>{{ drive.job_description }}</textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary px-4 me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary px-5 fw-bold">Save Changes</button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
